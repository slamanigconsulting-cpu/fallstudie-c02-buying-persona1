<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallstudie METALTEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1f3864; --blue2:#2f5597; --blue-soft:#e8edf6;
  --yellow:#ffe500; --yellow-soft:#fff8c2;
  --ink:#1d2433; --muted:#5b6475; --bg:#f5f6f9; --card:#ffffff; --line:#dde1e8;
  --pos:#2e7d32; --pos-soft:#e6f2e7; --neg:#b3261e; --neg-soft:#f9e5e3; --neu:#6b7280;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;}
header.top{background:var(--blue);color:#fff;padding:14px 16px 0}
.top .kicker{font-size:13px;letter-spacing:.04em;opacity:.85}
.top h1{margin:2px 0 4px;font-size:22px;line-height:1.25}
.top .grp{display:inline-block;background:var(--yellow);color:var(--blue);font-weight:700;font-size:13px;padding:2px 10px;border-radius:20px;margin-bottom:10px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:6px -16px 0;padding:0 16px}
nav.tabs button{flex:0 0 auto;background:transparent;border:0;color:#dfe6f3;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button.active{color:#fff;border-bottom-color:var(--yellow);font-weight:600}
nav.tabs button:disabled{opacity:.45;cursor:default}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
footer{border-top:1px solid var(--line);background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
h2{color:var(--blue);font-size:21px;margin:0 0 10px}
h3{color:var(--blue);font-size:17px;margin:22px 0 8px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table.ptab{width:100%;border-collapse:collapse;font-size:15px}
table.ptab th,table.ptab td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
table.ptab th{color:var(--blue);font-weight:600}
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.gpick button{background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:var(--radius);padding:18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.gpick button:hover{background:var(--blue-soft)}
.unlock{background:var(--yellow-soft);border:1px solid #e9d84a;border-radius:var(--radius);padding:14px;margin:14px 0}
.unlock input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:140px;text-transform:uppercase;letter-spacing:.12em}
.err{color:var(--neg);font-size:14px;margin-top:6px}
.event{background:var(--yellow-soft);border-left:5px solid var(--yellow);border-radius:6px;padding:12px 14px;margin:12px 0}
.event .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.event h4{margin:2px 0 6px;color:var(--blue);font-size:17px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.pcard .pn{font-weight:700;color:var(--blue)}
.pcard .pf{font-size:14px;color:var(--muted);margin-bottom:8px}
.fl{font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips label{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 9px;cursor:pointer;user-select:none;background:#fff}
.chips input{display:none}
.chips label.on{background:var(--blue);color:#fff;border-color:var(--blue)}
select,textarea,input[type=text]{font:inherit;font-size:15px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved{font-size:13px;color:var(--pos);margin-left:8px}
.mood{display:grid;grid-template-columns:150px 1fr 34px;gap:6px 10px;align-items:center;font-size:15px}
.mood .bar{position:relative;height:14px;background:#eef0f4;border-radius:7px}
.mood .bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#9aa3b2}
.mood .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.mood .val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chg{font-size:12px;margin-left:4px}
.slot{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.slot .no{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:26px;font-weight:700;font-size:14px;margin-right:8px}
.slotgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.res{border-left:5px solid var(--neu);background:#fff;border-radius:6px;padding:12px 14px;margin-bottom:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.res.pos{border-left-color:var(--pos)}
.res.neg{border-left-color:var(--neg)}
.res.info{border-left-color:var(--yellow)}
.res .hd{font-weight:700;color:var(--blue)}
.res .sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.badge{display:inline-block;font-size:13px;font-weight:700;border-radius:12px;padding:1px 9px;margin-left:6px}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.neu{background:#eceef2;color:var(--neu)}
.note{font-size:14px;margin-top:6px;padding:6px 10px;border-radius:5px;background:#f2f4f8}
.note.neg{background:var(--neg-soft)}
.note.pos{background:var(--pos-soft)}
.lockbox{border:1px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted);background:#fff}
@media (max-width:640px){
  .slotgrid,.two{grid-template-columns:1fr}
  .mood{grid-template-columns:110px 1fr 30px;font-size:14px}
  .top h1{font-size:19px}
}
@media print{nav.tabs,footer,.btn{display:none}}
</style>
</head>

var LS_KEY = 'metaltec_fallstudie_v1';
var mem = {};
function blank(){ return {group:null, created:new Date().toISOString(), tab:'start',
  map:{draft:{persons:{}, extra:[], comment:''}, v1:null, v2:null},
  codes:{}, sim:null, roundDraft:{} }; }
var S = blank();
function load(){ try{ var t = localStorage.getItem(LS_KEY); if(t){ S = Object.assign(blank(), JSON.parse(t)); } }catch(e){} }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Kryptografie ---------- */
function b64(s){ var bin = atob(s); var u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function normCode(c){ return (c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
async function decrypt(code, blob){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(normCode(code)), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.s), iterations:blob.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.i)}, key, b64(blob.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(slot, code){
  var blob = SECRETS[S.group] && SECRETS[S.group][slot];
  if(!blob) return null;
  try{ var data = await decrypt(code, blob); S.codes[slot] = normCode(code); mem[slot] = data; applySecret(slot); save(); return data; }
  catch(e){ return null; }
}
var Engine = null;
function applySecret(slot){ if(slot==='R1' && mem.R1){ if(mem.R1.extraPerson) PUB.p11 = mem.R1.extraPerson; if(!Engine) Engine = (new Function('var module; ' + mem.R1.engineSrc + '; return Engine;'))(); } }
async function restore(){
  for (var slot in S.codes){ try{ mem[slot] = await decrypt(S.codes[slot], SECRETS[S.group][slot]); applySecret(slot); }catch(e){ delete S.codes[slot]; } }
}

/* ---------- DOM-Helfer ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  if(attrs) for (var k in attrs){
    var v = attrs[k];
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2), v);
    else if(v!==null && v!==undefined && v!==false) el.setAttribute(k, v===true?'':v);
  }
  for (var i=2;i<arguments.length;i++){
    var c = arguments[i]; if(c==null||c===false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x!=null&&x!==false) el.appendChild(typeof x==='string'?document.createTextNode(x):x); });
    else el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}
function personName(id){ if(id==='p11') return PUB.p11.name; if(id==='recherche') return 'Hintergrundrecherche'; var p = PUB.persons.find(function(x){return x.id===id;}); return p?p.name:id; }
function personShort(id){ var n = personName(id); return n.replace(/^(Mag\.|DI \(FH\)|Dr\.|Ing\.)\s+/,'').replace(/,.*$/,''); }
function msgName(id){ var m = PUB.msgs.find(function(x){return x.id===id;}); return m?m.t:''; }
function chanName(id){ var c = PUB.chans.find(function(x){return x.id===id;}); return c?c.t:''; }
function fmt(v){ return v>0?'+'+v:String(v); }

    h('p',{text:'Das aktuelle ERP-System ist 14 Jahre alt und wird durch zahlreiche Insellösungen ergänzt (separate Lagerverwaltung, Excel-basierte Produktionsplanung, ein nicht angebundenes CRM). Mit dem Export- und Servicewachstum stoßen die Prozesse an ihre Grenzen: Liefertermine sind schwer planbar, Bestände intransparent, Angebote dauern zu lange. Die Geschäftsführung hat die Einführung eines integrierten ERP-Systems beschlossen.'}),
    h('h3',{text:'Der Projektrahmen'}),
    h('p',{text:'Das Investitionsvolumen liegt bei rund 2,4 Mio. Euro über drei Jahre (Lizenzen, Einführung, Schulung, Betrieb). Der Entscheidungshorizont beträgt etwa neun bis zwölf Monate. Drei Anbieter sind auf der Shortlist. Eine externe Beratung begleitet den Auswahlprozess.'}),
    h('h3',{text:'Die handelnden Personen'}),
    h('table',{class:'ptab'},
      h('thead',null,h('tr',null,h('th',{text:'Person'}),h('th',{text:'Funktion'}),h('th',{text:'Signale aus dem Projektalltag'}))),
      h('tbody',null,PUB.persons.map(function(p){ return h('tr',null,h('td',{text:p.name}),h('td',{text:p.fn}),h('td',{text:p.sig})); }))
    )
  ));
  w.appendChild(h('div',{class:'card'},
    h('h2',{text:'Ablauf'}),
    h('p',{text:'Die Fallstudie umfasst drei aufeinander aufbauende Teile. Einzelne Inhalte sind gesperrt und werden während der Lehrveranstaltung über Codes freigeschaltet, die Sie von der Spielleitung erhalten.'}),
    h('p',{class:'small muted',text:'Ihre Eingaben werden laufend auf diesem Gerät gespeichert. Am Ende exportieren Sie Ihre Ergebnisse im Bereich „Ergebnis“.'})
  ));
  return w;
}

/* ---------- Teil 1 ---------- */
function chipGroup(options, selected, onchange){
  selected = selected || [];
  return h('div',{class:'chips'}, options.map(function(o){
    var on = selected.indexOf(o)>=0;
    var lab = h('label',{class:on?'on':''}, h('input',{type:'checkbox'}), o);
    lab.addEventListener('click', function(ev){ ev.preventDefault();
      var i = selected.indexOf(o); if(i>=0) selected.splice(i,1); else selected.push(o);
      lab.className = selected.indexOf(o)>=0?'on':''; onchange(selected); });
    return lab;
  }));
}
function selectEl(options, value, onchange, placeholder){
  var s = h('select',{onchange:function(){ onchange(s.value); }},
    h('option',{value:''}, placeholder||'bitte wählen'),
    options.map(function(o){ var v = typeof o==='string'?o:o.v; var t = typeof o==='string'?o:o.t;
      return h('option',{value:v, selected:String(value)===String(v)}, t); }));
  return s;
}
function personFields(rec, flash){
  function upd(){ save(); flash(); }
  return [
    h('div',{class:'fl',text:'Rolle(n) im Buying Center'}),
    chipGroup(PUB.roles, rec.roles = rec.roles||[], upd),
    h('div',{class:'two'},
      h('div',null,h('div',{class:'fl',text:'Einfluss formal'}), selectEl(PUB.levels, rec.formal, function(v){rec.formal=v;upd();})),
      h('div',null,h('div',{class:'fl',text:'Einfluss informell'}), selectEl(PUB.levels, rec.informal, function(v){rec.informal=v;upd();}))
    ),
    h('div',{class:'fl',text:'Promotor oder Gegenspieler'}),
    selectEl(PUB.positions, rec.position, function(v){rec.position=v;upd();}),
    h('div',{class:'fl',text:'Hauptbeteiligung (Phase)'}),
    chipGroup(PUB.phases, rec.phases = rec.phases||[], upd),
    h('div',{class:'fl',text:'Zentrale Interessen'}),
    (function(){ var i = h('input',{type:'text', value:rec.interests||''}); i.addEventListener('input',function(){rec.interests=i.value;upd();}); return i; })()
  ];
}
function vTeil1(){
  var d = S.map.draft;
  var w = h('div');
  var flashEl = h('span',{class:'saved'});
  var tmr; function flash(){ flashEl.textContent='gespeichert'; clearTimeout(tmr); tmr=setTimeout(function(){flashEl.textContent='';},1200); }

  w.appendChild(h('div',{class:'card'},
    h('h2',{text:'Teil 1 · Buying-Center-Map'}),
    h('p',{text:'Ordnen Sie die beteiligten Personen den Rollen im Buying Center zu, schätzen Sie ihren formalen und informellen Einfluss ein, bestimmen Sie die Phase ihrer Hauptbeteiligung und markieren Sie Promotoren sowie mögliche Gegenspieler. Begründen Sie Mehrfachrollen im Kommentar.'}),
    h('p',{class:'small muted',text:'Rollen: Initiator, Anwender (User), Beeinflusser (Influencer), Einkäufer (Buyer), Entscheider (Decider), Gatekeeper. Phasen: früh (Bedarf und Anforderungen), mittel (Lösungssuche und Evaluierung), spät (Bewertung und Abschluss), Nachkauf (Einführung und Nutzung).'})
  ));

  if(mem.A){
    w.appendChild(h('div',{class:'event'},
      h('div',{class:'lbl',text:'Ereigniskarte'}), h('h4',{text:mem.A.title}), h('p',{text:mem.A.text}),
      h('p',{class:'small',text:'Prüfen Sie Ihre Buying-Center-Map vor diesem Hintergrund und speichern Sie anschließend die überarbeitete Fassung. Bei Bedarf können Sie weitere Personen ergänzen.'})
    ));
  }

  var grid = h('div',{class:'pgrid'});
  PUB.persons.forEach(function(p){
    var rec = d.persons[p.id] = d.persons[p.id] || {};
    grid.appendChild(h('div',{class:'pcard'}, h('div',{class:'pn',text:p.name}), h('div',{class:'pf',text:p.fn}), personFields(rec, flash)));
  });
  (d.extra||[]).forEach(function(rec, i){
    var nm = h('input',{type:'text', value:rec.name||'', placeholder:'Name'}); nm.addEventListener('input',function(){rec.name=nm.value;save();flash();});
    var fn = h('input',{type:'text', value:rec.fn||'', placeholder:'Funktion'}); fn.addEventListener('input',function(){rec.fn=fn.value;save();flash();});
    grid.appendChild(h('div',{class:'pcard'}, h('div',{class:'two'},nm,fn), personFields(rec, flash),
      h('div',{style:'margin-top:8px'}, h('button',{class:'btn ghost',onclick:function(){ d.extra.splice(i,1); save(); render(); }},'Person entfernen'))));
  });
  w.appendChild(grid);

  if(mem.A){
    w.appendChild(h('div',{style:'margin:10px 0'}, h('button',{class:'btn sec',onclick:function(){ d.extra = d.extra||[]; d.extra.push({}); save(); render(); }},'Weitere Person ergänzen')));
  }

  var ta = h('textarea',{placeholder:'Drei bis fünf Sätze: Wo fällt die Entscheidung tatsächlich?'}); ta.value = d.comment||'';
  ta.addEventListener('input',function(){ d.comment = ta.value; save(); flash(); });
  w.appendChild(h('div',{class:'card'}, h('h3',{style:'margin-top:0',text:'Kommentar zur Entscheidungsfindung'}), ta));

  var bar = h('div',{class:'row'});
  if(!S.map.v1){
    bar.appendChild(h('button',{class:'btn',onclick:function(){
      if(!confirm('Fassung 1 jetzt abschließen? Danach kann die Ereigniskarte freigeschaltet werden.')) return;
      S.map.v1 = {at:new Date().toISOString(), data:JSON.parse(JSON.stringify(d))}; save(); render(); }},'Fassung 1 abschließen'));
  } else if(mem.A){
    bar.appendChild(h('button',{class:'btn',onclick:function(){
      S.map.v2 = {at:new Date().toISOString(), data:JSON.parse(JSON.stringify(d))}; save(); render(); }}, S.map.v2?'Überarbeitete Fassung erneut speichern':'Überarbeitete Fassung speichern'));
  }
  bar.appendChild(flashEl);
  w.appendChild(bar);

  var st = [];
  if(S.map.v1) st.push('Fassung 1 abgeschlossen am '+new Date(S.map.v1.at).toLocaleString('de-AT'));
  if(S.map.v2) st.push('Überarbeitete Fassung gespeichert am '+new Date(S.map.v2.at).toLocaleString('de-AT'));
  if(st.length) w.appendChild(h('p',{class:'small muted',style:'margin-top:8px'}, st.join(' · ')));

  if(S.map.v1 && !mem.A) w.appendChild(unlockBox('A','Ereigniskarte freischalten','Geben Sie den Code ein, den Sie von der Spielleitung erhalten.'));
  return w;
}

function unlockBox(slot, title, hint){
  var inp = h('input',{type:'text', maxlength:8, autocomplete:'off'});
  var err = h('div',{class:'err'});
  var btn = h('button',{class:'btn', onclick:go}, 'Freischalten');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  async function go(){
    btn.disabled = true; err.textContent='';
    var r = await tryUnlock(slot, inp.value);
    btn.disabled = false;
    if(r){ if(slot==='R1' && !S.sim){ S.sim = Engine.initSim(mem.R1, S.group); save(); } render(); }
    else err.textContent = 'Der Code ist für Ihre Gruppe nicht gültig.';
  }
  return h('div',{class:'unlock'}, h('strong',{text:title}), h('p',{class:'small',style:'margin:4px 0 8px',text:hint}), h('div',{class:'row'}, inp, btn), err);
}

/* ---------- Teil 2 ---------- */
function vTeil2(){
  return h('div',null, h('div',{class:'card'}, h('h2',{text:'Teil 2 · Persona-Interview und Steckbrief'}),
    h('div',{class:'lockbox'}, 'Dieser Teil wird im Prototyp noch nicht angeboten.')));
}

/* ---------- Teil 3 ---------- */
function moodPanel(sim, before){
  var vis = Engine.visibleValues(sim);
  var vb = before ? Engine.visibleValues(before) : null;
  var g = h('div',{class:'mood'});
  Object.keys(vis).forEach(function(p){
    var v = vis[p];
    var pct = Math.abs(v)/3*50;
    var col = v>0?'var(--pos)':v<0?'var(--neg)':'var(--neu)';
    var fill = h('div',{class:'fill', style:'background:'+col+';width:'+pct+'%;'+(v>=0?'left:50%':'right:50%')});
    var chg = null;
    if(vb && vb[p]!==undefined && vb[p]!==v){ var d=v-vb[p]; chg = h('span',{class:'chg', style:'color:'+(d>0?'var(--pos)':'var(--neg)'), text:(d>0?'▲':'▼')}); }
    if(vb && vb[p]===undefined) chg = h('span',{class:'chg', style:'color:var(--blue)', text:'neu'});
    g.appendChild(h('div',null, personShort(p), chg));
    g.appendChild(h('div',{class:'bar'}, fill));
    g.appendChild(h('div',{class:'val', style:'color:'+col, text:fmt(v)}));
  });
  return g;
}

function vTeil3(){
  var w = h('div');
  w.appendChild(h('div',{class:'card'},
    h('h2',{text:'Teil 3 · Vertriebssimulation'}),
    h('p',{text:'Ihr Team bearbeitet das Buying Center über vier Runden, die den Kaufphasen entsprechen. In jeder Runde steht eine begrenzte Zahl an Kontakten zur Verfügung. Jeder Kontakt besteht aus einer Person, einer Botschaft und einem Kanal. Die Personen reagieren auf Ihre Wahl, und ihre Zustimmung verändert sich. Manche Kontakte bringen neue Informationen ans Licht.'}),
    h('p',{class:'small muted',text:'Zustimmung wird auf einer Skala von −3 (klare Ablehnung) bis +3 (aktive Unterstützung) angezeigt.'})
  ));
  if(!mem.R1){ w.appendChild(unlockBox('R1','Runde 1 freischalten','Geben Sie den Code ein, den Sie von der Spielleitung erhalten.')); return w; }
  if(!S.sim) { S.sim = Engine.initSim(mem.R1, S.group); save(); }
  var rd = PUB.rounds[1];
  var done = S.sim.rounds && S.sim.rounds[1];

  w.appendChild(h('div',{class:'card'}, h('h2',{text:rd.title}), h('p',{text:rd.text})));

  if(!done){
    w.appendChild(h('div',{class:'card'}, h('h3',{style:'margin-top:0',text:'Aktuelles Stimmungsbild'}), moodPanel(S.sim)));
    var n = rd.budget + (S.sim.extraNext||0);
    var draft = S.roundDraft[1] = S.roundDraft[1] || [];
    for (var i=0;i<n;i++) draft[i] = draft[i] || {};
    var plan = h('div',{class:'card'}, h('h3',{style:'margin-top:0',text:'Kontaktplanung ('+n+' Kontakte)'}));
    var persOpts = PUB.persons.map(function(p){ return {v:p.id, t:p.name+' ('+p.fn+')'}; });
    if(S.sim.disc.p11) persOpts.push({v:'p11', t:PUB.p11.name+' ('+PUB.p11.fn+')'});
    persOpts.push({v:'recherche', t:'Sonderaktion: Hintergrundrecherche'});
    var msgOpts = PUB.msgs.filter(function(m){ return !m.hidden || (m.id===8 && S.sim.disc.brunner); }).map(function(m){ return {v:m.id, t:m.t}; });
    var chanOpts = PUB.chans.map(function(c){ return {v:c.id, t:c.t}; });
    draft.slice(0,n).forEach(function(c, idx){
      var isR = c.person==='recherche';
      var ps = selectEl(persOpts, c.person, function(v){ c.person=v; if(v==='recherche'){ delete c.msg; delete c.chan; } save(); render(); }, 'Person wählen');
      var ms = selectEl(msgOpts, c.msg, function(v){ c.msg = v?Number(v):undefined; save(); });
      var cs = selectEl(chanOpts, c.chan, function(v){ c.chan = v||undefined; save(); });
      if(isR){ ms.disabled = true; cs.disabled = true; }
      plan.appendChild(h('div',{class:'slot'},
        h('div',null, h('span',{class:'no',text:String(idx+1)}), h('strong',{text:'Kontakt '+(idx+1)})),
        h('div',{class:'slotgrid'},
          h('div',null,h('div',{class:'fl',text:'Person'}),ps),
          h('div',null,h('div',{class:'fl',text:'Botschaft'}),ms),
          h('div',null,h('div',{class:'fl',text:'Kanal'}),cs))));
    });
    var err = h('div',{class:'err'});
    plan.appendChild(h('div',{class:'row'}, h('button',{class:'btn', onclick:function(){
      var cs = draft.slice(0,n);
      var bad = cs.findIndex(function(c){ return !c.person || (c.person!=='recherche' && (!c.msg || !c.chan)); });
      if(bad>=0){ err.textContent = 'Kontakt '+(bad+1)+' ist noch unvollständig.'; return; }
      if(!confirm('Runde 1 abschließen? Die Planung kann danach nicht mehr geändert werden.')) return;
      var before = JSON.parse(JSON.stringify(S.sim));
      S.sim = Engine.runRound(mem.R1, S.sim, cs.map(function(c){ return c.person==='recherche'?{person:'recherche'}:{person:c.person,msg:c.msg,chan:c.chan}; }), 1);
      S.sim.rounds[1].before = before.values; S.sim.rounds[1].beforeDisc = before.disc; S.sim.rounds[1].at = new Date().toISOString();
      save(); render(); window.scrollTo(0,0);
    }}, 'Runde abschließen'), err));
    w.appendChild(plan);
  } else {
    var R = S.sim.rounds[1];
    var resCard = h('div',{class:'card'}, h('h3',{style:'margin-top:0',text:'Reaktionen'}));
    R.log.forEach(function(e){
      var lvl = e.level;
      var badge = lvl==='info'? null : h('span',{class:'badge '+lvl, text:'Zustimmung '+fmt(e.delta)});
      var sub = e.person==='recherche' ? 'Sonderaktion' : msgName(e.msg)+' · '+chanName(e.chan);
      resCard.appendChild(h('div',{class:'res '+lvl},
        h('div',{class:'hd'}, (e.idx+1)+'. '+personName(e.person), badge),
        h('div',{class:'sub',text:sub}),
        h('div',{text:e.text}),
        (e.notes||[]).filter(function(nt){ return !(e.person==='reiter' && nt.kind==='info'); }).map(function(nt){ return h('div',{class:'note '+nt.kind, text:nt.text}); })
      ));
    });
    w.appendChild(resCard);
    R.events.forEach(function(ev){
      var title = (mem.R1.titles && mem.R1.titles[ev.type]) || 'Ereignis';
      w.appendChild(h('div',{class:'event'}, h('div',{class:'lbl',text:'Ereignis'}), h('h4',{text:title}), h('p',{text:ev.text})));
    });
    var beforeSim = {values:R.before, disc:R.beforeDisc};
    w.appendChild(h('div',{class:'card'}, h('h3',{style:'margin-top:0',text:'Stimmungsbild nach Runde 1'}), moodPanel(S.sim, beforeSim)));
    w.appendChild(h('div',{class:'lockbox'}, 'Runde 2 folgt in der Vollversion.'));
  }
  return w;
}

/* ---------- Ergebnis ---------- */
function vErgebnis(){
  var w = h('div');
  var lines = [];
  lines.push('Buying-Center-Map: ' + (S.map.v1 ? 'Fassung 1 abgeschlossen' : 'noch offen') + (S.map.v2 ? ', überarbeitete Fassung gespeichert' : ''));
  lines.push('Ereigniskarte Teil 1: ' + (mem.A ? 'freigeschaltet' : 'gesperrt'));
  lines.push('Simulation Runde 1: ' + (S.sim && S.sim.rounds && S.sim.rounds[1] ? 'abgeschlossen' : 'offen'));
  w.appendChild(h('div',{class:'card'},
    h('h2',{text:'Ergebnis und Export'}),
    h('ul',null, lines.map(function(l){ return h('li',{text:l}); })),
    h('p',{text:'Exportieren Sie Ihren Stand als Datei und geben Sie diese an die Spielleitung weiter. Die Datei enthält alle Eingaben und Entscheidungen Ihrer Gruppe mit Zeitstempel.'}),
    h('button',{class:'btn', onclick:exportJSON}, 'Ergebnisse exportieren')
  ));
  return w;
}
function exportJSON(){
  var out = {app:'metaltec-fallstudie', version:'prototyp-1', exported:new Date().toISOString(), group:S.group,
    map:{v1:S.map.v1, v2:S.map.v2, current:S.map.draft},
    sim: S.sim ? {rounds:S.sim.rounds, values:S.sim.values, disc:S.sim.disc} : null};
  var blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'metaltec_'+(S.group||'gruppe')+'_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  if(!confirm('Alle Eingaben dieses Geräts löschen und die Fallstudie auf Anfang stellen?')) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  S = blank(); mem = {}; render(); window.scrollTo(0,0);
});
load();
(async function(){ if(S.group) await restore(); render(); })();
